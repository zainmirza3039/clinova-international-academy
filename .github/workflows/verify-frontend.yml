name: Verify Clinova frontend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - review/clinova-all-updates-20261022

permissions:
  contents: write

concurrency:
  group: verify-clinova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and reconcile the stale lockfile
        run: npm install --no-audit --no-fund

      - name: Export reconciled lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: reconciled-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Sync lockfile on the existing review branch
        if: github.event_name == 'push' && github.ref_name == 'review/clinova-all-updates-20261022'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already matches package.json.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: sync npm lockfile'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build with public-facing services disabled
        env:
          VITE_VERIFICATION_ENABLED: 'false'
          VITE_AUTH_ENABLED: 'false'
          VITE_LEARNER_DATA_ENABLED: 'false'
          VITE_ENQUIRIES_ENABLED: 'false'
          VITE_INDEXING_ENABLED: 'false'
        run: npm run build
